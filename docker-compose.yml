services:
  intake:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.intake.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DECISION_SERVICE_URL=http://decision:8001
    depends_on:
      decision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]

  decision:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.decision.service.app:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - LLM_PROVIDER=groq
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]

  approval:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.approval.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]

  payment:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.payment.app:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      # Deliberate, unconditional: makes the INV-1012 payment-failure +
      # compensation journey demonstrable with a plain `docker compose up`,
      # at zero cost to every other invoice (only this one id ever fails).
      - PAYMENT_SIMULATE_FAILURE_IDS=INV-1012
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=approvalflow
      - POSTGRES_PASSWORD=approvalflow
      - POSTGRES_DB=approvalflow
    ports: ["5432:5432"]
    networks: [approvalflow]
    # Not used by any service yet - reserved for Dapr state store (separate phase).
    # Deliberately not behind `profiles:` - M4 requires the whole system, including
    # not-yet-used infrastructure, to come up with a single plain `docker compose up`.

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [approvalflow]
    # Backs the Dapr pubsub/statestore components (dapr/components/) - see the
    # intake-dapr/decision-dapr sidecars below. Not used by service code yet.
    # Deliberately not behind `profiles:` - see the postgres comment above (M4).

  intake-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "intake"
      - "--app-port"
      - "8000"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
    volumes:
      - "./dapr/components:/components:ro"
    network_mode: "service:intake"
    depends_on:
      intake:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
    # Infra only, step 1 of Dapr integration (M5) - not called by any service
    # code yet. Shares intake's network namespace so intake can later reach it
    # at localhost:3500 with zero networking changes. Pub/sub and state wiring
    # into IntakeService/Decider are separate, future steps.

  decision-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "decision"
      - "--app-port"
      - "8001"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
    volumes:
      - "./dapr/components:/components:ro"
    network_mode: "service:decision"
    depends_on:
      decision:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
    # See intake-dapr comment above - same reasoning, paired with decision.

  approval-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "approval"
      - "--app-port"
      - "8002"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
    volumes:
      - "./dapr/components:/components:ro"
    network_mode: "service:approval"
    depends_on:
      approval:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
    # See intake-dapr/decision-dapr comments above - same reasoning, paired with approval.

  payment-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "payment"
      - "--app-port"
      - "8003"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
    volumes:
      - "./dapr/components:/components:ro"
    network_mode: "service:payment"
    depends_on:
      payment:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
    # See intake-dapr/decision-dapr/approval-dapr comments above - same reasoning, paired with payment.

  placement:
    image: daprio/placement:1.18.1
    command: ["./placement", "--port", "50006"]
    networks: [approvalflow]
    # Dapr control-plane service. Only strictly required for actors/workflows
    # (which this project doesn't use) - included because it's the baseline
    # piece of nearly every Dapr+Compose reference setup and costs little (no
    # volume, no root user). The scheduler service was considered and
    # rejected: same actors/workflow-only scope as placement, but requires a
    # persistent etcd volume and a root user - not worth it for a capability
    # this project has no plan to use.

networks:
  approvalflow:
    driver: bridge
