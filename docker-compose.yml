services:
  gateway:
    image: traefik:v3.1.2
    # Pinned to an exact patch version, not the floating v3.1 tag - consistent
    # with daprio/daprd:1.18.1 / daprio/placement:1.18.1 below (both exact-pinned,
    # unlike redis:7-alpine/postgres:16-alpine which are deliberately major-only).
    # Traefik is infra-critical like Dapr here, not a "dumb" resource container.
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
      - "--accesslog=true"
    # File provider, not Docker provider: empirically confirmed the Docker
    # provider is incompatible with this environment's Docker Engine (29.0.1) -
    # see ADR-007 and traefik/dynamic.yml's own header comment for the full
    # story (tried two Traefik versions + forcing DOCKER_API_VERSION, all
    # failed identically with a bare "400 Bad Request" from the daemon).
    # Static file-based routing sidesteps the incompatibility entirely and,
    # as a side benefit, needs no Docker socket access at all.
    ports:
      - "8080:80"
    volumes:
      - "./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      intake:
        condition: service_healthy
      approval:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
      audit:
        condition: service_healthy
      ui:
        condition: service_healthy
    # Unlike the Docker provider, the file provider has no independent way to
    # notice new backends coming up - its routes are static from the start,
    # so there's no benefit to letting gateway start before its backends are
    # ready (nothing to "discover" later). depends_on here just gives cleaner
    # startup ordering, matching every other service in this file.
    networks: [approvalflow]

  intake:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.intake.app:app --host 0.0.0.0 --port 8000
    environment:
      - DECISION_SERVICE_URL=http://decision:8001
      - JWT_SECRET_DAPR_ENABLED=true
    env_file:
      - .env
    depends_on:
      decision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping anymore - gateway is the only external entry point
    # (M6). Routed via traefik/dynamic.yml (file provider), not labels here -
    # see the gateway service's comment above for why.

  decision:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.decision.service.app:app --host 0.0.0.0 --port 8001
    environment:
      - LLM_PROVIDER=groq
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping and no gateway route: Decision is pure choreography -
    # nothing external (no script, no test, no future UI) ever calls it over
    # HTTP; /decisions is a testing/dev artifact only. Giving it a public
    # gateway route with zero consumers would be the opposite of "hide internal
    # structure" (M6) - it stays reachable only via Dapr pub/sub and the
    # internal Docker network.

  approval:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.approval.app:app --host 0.0.0.0 --port 8002
    environment:
      - JWT_SECRET_DAPR_ENABLED=true
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping - see intake's comment above.

  payment:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.payment.app:app --host 0.0.0.0 --port 8003
    environment:
      # Deliberate, unconditional: makes the INV-1012 payment-failure +
      # compensation journey demonstrable with a plain `docker compose up`,
      # at zero cost to every other invoice (only this one id ever fails).
      - PAYMENT_SIMULATE_FAILURE_IDS=INV-1012
      - JWT_SECRET_DAPR_ENABLED=true
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping - see intake's comment above. Exposes two path
    # prefixes through the gateway (/payments, /budgets) - see traefik/dynamic.yml.

  notification:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.notification.app:app --host 0.0.0.0 --port 8004
    environment:
      - JWT_SECRET_DAPR_ENABLED=true
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping - see intake's comment above.

  audit:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.audit.app:app --host 0.0.0.0 --port 8005
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=approvalflow
      - POSTGRES_PASSWORD=approvalflow
      - POSTGRES_DB=approvalflow
      - JWT_SECRET_DAPR_ENABLED=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping - see intake's comment above. F9's audit trail:
    # consumes decision.completed/approval.completed/payment.completed
    # (pure choreography, no service calls it directly), reachable externally
    # only via the gateway's /audit route. Deliberately the one service that
    # talks to Postgres directly instead of Dapr state (ADR-008) - the app
    # itself creates its own schema at startup (ensure_schema(), no migration
    # framework), which is why it needs postgres healthy first (nothing else
    # in this file depended on postgres being ready until now).

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.ui.app:app --host 0.0.0.0 --port 8006
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping - see intake's comment above. M7's static UI:
    # no Dapr sidecar (ARCHITECTURE.md's UI row shows Dapr block "-" - REST-
    # to-gateway only, no pub/sub/state of its own), no dependency on any
    # other service at startup - it's just a StaticFiles mount (ADR-010).
    # Reachable externally only via the gateway's /ui route; the browser's
    # own JS calls the other services' existing endpoints directly through
    # that same gateway (same-origin, no CORS needed).

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=approvalflow
      - POSTGRES_PASSWORD=approvalflow
      - POSTGRES_DB=approvalflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvalflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [approvalflow]
    # Now backs the Audit service's `audit_trail` table (F9, ADR-008) via direct
    # asyncpg access - no longer unused. Deliberately not behind `profiles:` -
    # M4 requires the whole system to come up with a single plain `docker compose up`.

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [approvalflow]
    # Backs the Dapr pubsub/statestore components (dapr/components/) - see the
    # intake-dapr/decision-dapr sidecars below. Not used by service code yet.
    # Deliberately not behind `profiles:` - see the postgres comment above (M4).

  intake-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "intake"
      - "--app-port"
      - "8000"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
      - "--config"
      - "/components/tracing.yaml"
    volumes:
      - "./dapr/components:/components:ro"
    env_file:
      - .env
    # secretstores.local.env (dapr/components/secretstore.yaml, M5/N1) reads
    # from THIS container's own process env, not intake's - the sidecar and
    # the app share a network namespace but not an environment, so
    # JWT_SECRET needs to be loaded here too for the secret store to see it
    # (same reasoning decision-dapr's own comment below already documents
    # for GROQ_API_KEY).
    network_mode: "service:intake"
    depends_on:
      intake:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # Infra only, step 1 of Dapr integration (M5) - not called by any service
    # code yet. Shares intake's network namespace so intake can later reach it
    # at localhost:3500 with zero networking changes. Pub/sub and state wiring
    # into IntakeService/Decider are separate, future steps.
    # --config /components/tracing.yaml (N4): exports spans for this
    # sidecar's pub/sub and service-invocation calls to Jaeger, via Dapr's
    # own tracing exporter - no code change in intake itself.

  decision-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "decision"
      - "--app-port"
      - "8001"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
      - "--config"
      - "/components/tracing.yaml"
    volumes:
      - "./dapr/components:/components:ro"
    env_file:
      - .env
    # secretstores.local.env (dapr/components/secretstore.yaml, M5) reads
    # from THIS container's own process env, not decision's - the sidecar
    # and the app share a network namespace but not an environment, so
    # GROQ_API_KEY needs to be loaded here too for the secret store to see it.
    network_mode: "service:decision"
    depends_on:
      decision:
        condition: service_started
      placement:
        condition: service_started
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    # See intake-dapr comment above - same reasoning, paired with decision.

  approval-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "approval"
      - "--app-port"
      - "8002"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
      - "--config"
      - "/components/tracing.yaml"
    volumes:
      - "./dapr/components:/components:ro"
    env_file:
      - .env
    # JWT_SECRET needed here too (secretstores.local.env reads the
    # sidecar's own env) - see intake-dapr's comment above for the full
    # reasoning.
    network_mode: "service:approval"
    depends_on:
      approval:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # See intake-dapr/decision-dapr comments above - same reasoning, paired with approval.

  payment-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "payment"
      - "--app-port"
      - "8003"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
      - "--config"
      - "/components/tracing.yaml"
    volumes:
      - "./dapr/components:/components:ro"
    env_file:
      - .env
    # JWT_SECRET needed here too - see intake-dapr's comment above.
    network_mode: "service:payment"
    depends_on:
      payment:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # See intake-dapr/decision-dapr/approval-dapr comments above - same reasoning, paired with payment.

  notification-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "notification"
      - "--app-port"
      - "8004"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
      - "--config"
      - "/components/tracing.yaml"
    volumes:
      - "./dapr/components:/components:ro"
    env_file:
      - .env
    # JWT_SECRET needed here too - see intake-dapr's comment above.
    network_mode: "service:notification"
    depends_on:
      notification:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # See intake-dapr/decision-dapr/approval-dapr/payment-dapr comments above - same reasoning, paired with notification.

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.auth.app:app --host 0.0.0.0 --port 8007
    environment:
      - JWT_SECRET_DAPR_ENABLED=true
    env_file:
      - .env
    # JWT_SECRET (and optional JWT_EXPIRY_HOURS) still read directly from
    # this container's own env as the fail-fast fallback at construction
    # (unchanged - see services/auth/service.py) - but M5/N1 now also route
    # it through Dapr's Secrets API, same mechanism GROQ_API_KEY already
    # used (dapr_secret_loader.py): shared/jwt_secret_loader.py fetches it
    # once at startup via auth-dapr's sidecar, and every service that
    # verifies a JWT (not just Auth that issues one) reads the same
    # Dapr-sourced value through app.state.jwt_secret (shared/auth.py).
    # JWT_SECRET_DAPR_ENABLED gates the attempt (see shared/jwt_secret_loader.py's
    # module docstring for why - avoids DaprClient()'s 60s constructor block
    # in tests, which don't set this flag).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [approvalflow]
    # No host port mapping - see intake's comment above.

  auth-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "auth"
      - "--app-port"
      - "8007"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
      - "--config"
      - "/components/tracing.yaml"
    volumes:
      - "./dapr/components:/components:ro"
    env_file:
      - .env
    # JWT_SECRET needed here too - see intake-dapr's comment above. Auth is
    # the one service that both issues (login) and verifies JWTs, both
    # through this same Dapr-sourced secret (services/auth/app.py).
    network_mode: "service:auth"
    depends_on:
      auth:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # See intake-dapr/decision-dapr/approval-dapr/payment-dapr/notification-dapr
    # comments above - same reasoning, paired with auth. State store only
    # (dapr/components/statestore.yaml) - auth doesn't publish/subscribe to
    # anything, so it's deliberately NOT added to pubsub.yaml's scopes.

  audit-dapr:
    image: daprio/daprd:1.18.1
    command:
      - "./daprd"
      - "--app-id"
      - "audit"
      - "--app-port"
      - "8005"
      - "--placement-host-address"
      - "placement:50006"
      - "--resources-path"
      - "/components"
      - "--config"
      - "/components/tracing.yaml"
    volumes:
      - "./dapr/components:/components:ro"
    env_file:
      - .env
    # JWT_SECRET needed here too - see intake-dapr's comment above.
    network_mode: "service:audit"
    depends_on:
      audit:
        condition: service_started
      placement:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # See intake-dapr/decision-dapr/approval-dapr/payment-dapr/notification-dapr
    # comments above - same reasoning, paired with audit. Only for pub/sub
    # (audit is in dapr/components/pubsub.yaml's scopes, deliberately NOT in
    # statestore.yaml's - it uses Postgres directly instead, see ADR-008).

  placement:
    image: daprio/placement:1.18.1
    command: ["./placement", "--port", "50006"]
    networks: [approvalflow]
    # Dapr control-plane service. Only strictly required for actors/workflows
    # (which this project doesn't use) - included because it's the baseline
    # piece of nearly every Dapr+Compose reference setup and costs little (no
    # volume, no root user). The scheduler service was considered and
    # rejected: same actors/workflow-only scope as placement, but requires a
    # persistent etcd volume and a root user - not worth it for a capability
    # this project has no plan to use.

  jaeger:
    image: jaegertracing/jaeger:2.19.0
    # Jaeger v2 (OpenTelemetry Collector-based) - v1 all-in-one reached
    # end-of-life 2025-12-31, already past, so v2 is used despite needing a
    # small pipeline config file (./jaeger/config.yaml) instead of one env
    # var. Distributed tracing backend (N4) - every Dapr sidecar exports
    # spans to it automatically (dapr/components/tracing.yaml), no
    # application code changes.
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - "./jaeger/config.yaml:/etc/jaeger/config.yaml:ro"
    ports:
      - "16686:16686"   # Jaeger UI - dev/demo tooling, same precedent as
      # postgres/redis keeping a host port despite M6's "hide internal
      # structure" gateway rule (this isn't business API surface).
    networks: [approvalflow]
    # No host port for 9411 (Zipkin receiver) - sidecar-to-jaeger traffic
    # only, reachable via the `approvalflow` network by hostname `jaeger`
    # (same principle as redis/placement already being reachable that way).
    # No healthcheck: this container is only a tracing backend, and span
    # export is async/non-blocking - sidecars tolerate it being briefly
    # unavailable at startup. Same precedent as `placement` above, which
    # also has no healthcheck.

networks:
  approvalflow:
    driver: bridge
