# Static routing config for the API Gateway (M6) - Traefik's file provider.
#
# Not the Docker provider (label-based auto-discovery): empirically confirmed
# incompatible with this environment's Docker Engine (29.0.1, API 1.52,
# minimum 1.44) - Traefik's vendored Docker client gets a bare "400 Bad
# Request" from the daemon regardless of Traefik version (tried v3.1.2 and
# v3.5.6, plus forcing DOCKER_API_VERSION=1.44 - all failed identically).
# See ADR-007 for the full reasoning.
#
# This file is still "logic free" per ARCHITECTURE.md's own mandate for the
# gateway - static routing + rate-limit declaration, no code. The one real
# trade-off versus the Docker provider: backend addresses are fixed here,
# not dynamically discovered - a non-issue for this project's static
# docker-compose topology (no scaling/rescheduling to react to).
#
# IMPORTANT (confirmed empirically, N1): the file provider does NOT hot-
# reload by default - `--providers.file.watch=true` isn't set on the
# gateway's command in docker-compose.yml. Editing this file while the
# gateway container is already running has no effect until it's restarted
# (`docker compose restart gateway`) - a new router added here will 404
# silently otherwise, with no error anywhere.

http:
  middlewares:
    ratelimit:
      rateLimit:
        average: 10
        burst: 50
        # Shared by every router below (not one middleware per service) -
        # one per-client-IP budget across the whole gateway, matching "the
        # single external entry point" more closely than independent budgets
        # per route. burst=50 (not a stricter default) gives real headroom
        # for verify_phase8.py's own submit/poll/approve traffic pattern.
    stripprefix-ui:
      stripPrefix:
        prefixes: ["/ui"]
        # Only the ui router uses this: services/ui's StaticFiles mount is at
        # "/" and knows nothing about being served under /ui externally (the
        # same "logic free", mount-path-agnostic posture as every other
        # service here) - PathPrefix alone forwards the full original path
        # unchanged, so /ui/style.css would 404 against a mount expecting
        # /style.css without this.

  routers:
    intake:
      rule: "PathPrefix(`/invoices`)"
      entryPoints: ["web"]
      service: intake
      middlewares: ["ratelimit"]
    approval:
      rule: "PathPrefix(`/approvals`)"
      entryPoints: ["web"]
      service: approval
      middlewares: ["ratelimit"]
    payment:
      rule: "PathPrefix(`/payments`)"
      entryPoints: ["web"]
      service: payment
      middlewares: ["ratelimit"]
    budgets:
      rule: "PathPrefix(`/budgets`)"
      entryPoints: ["web"]
      service: payment   # same backend as the payment router above
      middlewares: ["ratelimit"]
    notification:
      rule: "PathPrefix(`/notifications`)"
      entryPoints: ["web"]
      service: notification
      middlewares: ["ratelimit"]
    audit:
      rule: "PathPrefix(`/audit`)"
      entryPoints: ["web"]
      service: audit
      middlewares: ["ratelimit"]
    auth:
      rule: "PathPrefix(`/auth`)"
      entryPoints: ["web"]
      service: auth
      middlewares: ["ratelimit"]
      # Same rate-limit middleware as every other router - no dedicated
      # login/register throttling added (N1's Out of scope): this generic
      # per-client-IP budget already covers /auth/login and /auth/register
      # incidentally, the same way it already covers every other route.
    ui:
      rule: "PathPrefix(`/ui`)"
      entryPoints: ["web"]
      service: ui
      middlewares: ["ratelimit", "stripprefix-ui"]
    # Decision has no router here, deliberately: pure choreography, nothing
    # external ever calls it over HTTP - see ARCHITECTURE.md §7/§4.

  services:
    intake:
      loadBalancer:
        servers:
          - url: "http://intake:8000"
    approval:
      loadBalancer:
        servers:
          - url: "http://approval:8002"
    payment:
      loadBalancer:
        servers:
          - url: "http://payment:8003"
    notification:
      loadBalancer:
        servers:
          - url: "http://notification:8004"
    audit:
      loadBalancer:
        servers:
          - url: "http://audit:8005"
    auth:
      loadBalancer:
        servers:
          - url: "http://auth:8007"
    ui:
      loadBalancer:
        servers:
          - url: "http://ui:8006"
