name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # manual re-run without a new commit

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # a rapid string of pushes cancels the stale runs, not just queues them

permissions:
  contents: read # least privilege - this workflow never needs to write anything

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_PROVIDER: mock # explicit, not just relying on the factory's default -
      # self-documenting: CI never touches the real Groq API
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e .[dev] # editable - a non-editable `pip install .` leaves a
        # build/lib/ copy of services/shared in the checkout, which mypy then flags as
        # a duplicate module (confirmed by reproducing the failure locally)
      - name: Environment info
        run: |
          python --version
          pip --version
          echo "LLM_PROVIDER=$LLM_PROVIDER"
          pip freeze | grep -E "pytest|ruff|mypy" # exact resolved versions - deps are >=, not pinned
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Pytest (with coverage)
        run: pytest --cov=services --cov=shared --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7 # visibility only, not an audit trail - no need to keep longer

  docker-build:
    # Deliberately NOT `needs: quality` - independent failure modes (a broken
    # Dockerfile and a broken test are unrelated), and there's no technical
    # dependency (this doesn't consume anything quality produces). Sequencing
    # would only save runner-minutes on failure, at the cost of hiding a
    # Dockerfile break until a separate push - less information per push, not
    # more, for a project at this CI volume.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t approvalflow:ci .
        # Goal: prove the Dockerfile stays buildable as the code changes, not
        # a smoke test of the running app - no `docker run` here. The full
        # running-system checks are exactly the docker-compose verification
        # scripts (scripts/verify_phase8.py etc.) deliberately excluded from
        # CI - they need a real Dapr/Redis/Postgres/Traefik stack and one of
        # them (INV-1013) needs the real Groq LLM, the opposite of "stubbed".

  publish:
    # N2 (CD): build+publish the image to GHCR, but only from a real merge to
    # main - never from a feature branch or PR, regardless of how green they
    # are. needs: [quality, docker-build] - anticipated in the original CI
    # design: "a future deploy job could simply be needs: [quality,
    # docker-build] without changing what already exists."
    needs: [quality, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # job-level override only - the workflow-level
      # `permissions: contents: read` above stays untouched for every other
      # job (least privilege: only this job ever needs to push a package)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # no new secret - the
          # token GitHub Actions already provides every run
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.title=ApprovalFlow
        # Deliberately rebuilds the image here rather than reusing
        # docker-build's - GitHub Actions doesn't share Docker layers
        # between jobs by default, and a shared `cache-from`/`cache-to:
        # type=gha` layer cache was considered and rejected for the same
        # reason docker/setup-buildx-action was rejected for docker-build
        # itself: added complexity (buildx setup, cache-key management) not
        # justified at this project's CI volume. The duplication also keeps
        # docker-build (runs always, validate-only) and publish (runs only
        # on main, has side effects) cleanly isolated from each other.
