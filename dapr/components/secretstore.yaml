apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.env
  version: v1
scopes:
  - decision
# Reads secrets from the sidecar's own process environment (decision-dapr's
# env_file: .env in docker-compose.yml, not decision's) - the same
# GROQ_API_KEY already used there, just accessed through Dapr's generic
# Secrets API instead of os.environ directly (M5). See
# services/decision/service/dapr_secret_loader.py.
