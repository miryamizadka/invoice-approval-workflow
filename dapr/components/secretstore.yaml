apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
spec:
  type: secretstores.local.env
  version: v1
scopes:
  - decision
  - auth
  - intake
  - approval
  - payment
  - notification
  - audit
# Reads secrets from each sidecar's own process environment (e.g.
# decision-dapr's env_file: .env in docker-compose.yml, not decision's) -
# the same GROQ_API_KEY/JWT_SECRET already used there, just accessed
# through Dapr's generic Secrets API instead of os.environ directly (M5).
#
# decision only ever reads GROQ_API_KEY (services/decision/service/
# dapr_secret_loader.py). The other six scopes are JWT_SECRET
# (shared/jwt_secret_loader.py) - auth issues tokens with it, the other
# five verify tokens with it (decision has no authenticated HTTP routes at
# all - see ARCHITECTURE.md/README's Authentication & roles section - so it
# never needs JWT_SECRET). Dapr's per-component `scopes` is least-privilege
# by app-id, same reasoning already applied to pubsub.yaml/statestore.yaml:
# a service only appears here if it genuinely reads a secret through this
# component.
