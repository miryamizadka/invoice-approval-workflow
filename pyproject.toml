[project]
name = "invoice-approval-workflow"
version = "0.1.0"
description = "AI-assisted invoice and expense approval platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "dapr==1.18.1",
    "dapr-ext-fastapi==1.18.1",
    "asyncpg>=0.29",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are deliberately re-evaluated per-request
# by FastAPI itself (not a real B008 mutable-default-argument bug) - this is
# ruff's own documented mechanism for that exact interaction, not a blanket
# B008 suppression.
extend-immutable-calls = [
    "fastapi.Depends",
    "shared.auth.require_role",
    "shared.rate_limiter.throttle_by_user",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["services*", "shared*"]